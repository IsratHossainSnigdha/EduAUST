services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduaust-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eduaust
      DB_USERNAME: eduaust
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eduaust

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduaust-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    networks:
      - eduaust

  # MySQL Database
  db:
    image: mysql:8.4
    container_name: eduaust-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eduaust
      MYSQL_USER: eduaust
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-psecretpassword"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eduaust

networks:
  eduaust:
    driver: bridge

volumes:
  dbdata:
  backend_vendor:
  frontend_node_modules: