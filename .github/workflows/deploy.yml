name: Deploy EduAUST

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_USER: s20230204012
  DEPLOY_HOST: 187.52.122.100

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          tools: composer

      - name: Install Laravel dependencies
        working-directory: backend
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Verify React build
        run: |
          if [ ! -f backend/public/app/index.html ]; then
            echo "React build failed: backend/public/app/index.html not found"
            exit 1
          fi

      - name: Create release archive
        run: |
          tar -czf release.tar.gz \
            --exclude='.env' \
            --exclude='./.env' \
            --exclude='storage/logs/*' \
            -C backend .

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > deploy_key
          chmod 600 deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh-keygen -y -f deploy_key > /dev/null

      - name: Copy release to VPS
        run: |
          scp \
            -i deploy_key \
            -o IdentitiesOnly=yes \
            release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:~/release.tar.gz"

      - name: Deploy on VPS
        run: |
          ssh \
            -i deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             mkdir -p ~/laravel
             tar -xzf ~/release.tar.gz -C ~/laravel
             chmod -R u+rwX ~/laravel/storage ~/laravel/bootstrap/cache
             cd ~/laravel
             php artisan migrate --force
             php artisan optimize
             rm ~/release.tar.gz'
